name: Build and Sign

on:
  workflow_dispatch: # Actions sekmesinden tek tıkla elle çalıştırmanızı sağlar
  push:
    branches: [ main ]

jobs:
  sign-project:
    runs-on: windows-latest
    steps:
      - name: Depoyu İndir (Checkout)
        uses: actions/checkout@v4

      # Not: Eğer kaynak koddan (.py, .cs, .cpp) derleme yapıyorsanız derleme komutunuz buraya gelir.
      # Şimdilik deponuzdaki dosyayı paketleyip SignPath'e gönderen yapı:
      - name: İmzalanacak Dosyayı Artifact Olarak Kaydet
        id: upload-step
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-artifact
          path: core/*.exe # İmzalanacak .exe dosyanız neredeyse tam yolunu yazın

      - name: SignPath ile Kod İmzala
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: '21688624-20d6-4e6c-b145-be3bbcc28432'
          project-slug: 'goodbyedpi-promax'
          signing-policy-slug: 'test-signing'
          github-artifact-id: ${{ steps.upload-step.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: 'signed-output'

      - name: İmzalanmış Dosyayı Kaydet
        uses: actions/upload-artifact@v4
        with:
          name: signed-release
          path: signed-output/
